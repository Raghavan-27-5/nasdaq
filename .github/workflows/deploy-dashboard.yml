# Phase 11 dashboard - GitHub Pages deployment
#
# dashboard/src/data/ carries the committed acquisition bundle: REAL artifacts
# (synthetic:false) where they exist and fixture artifacts for surfaces still
# pending (ML, portfolio, universe identity copy). The generator below
# regenerates only the fixture surfaces - its guard skips every real artifact -
# so the deployed site serves the same real data as the local tree while the
# fixture path stays deterministic (stdlib only, no pip install needed).

name: Deploy dashboard to Pages

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'artifacts/manifests/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy mid-publish; let it finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate synthetic fixtures
        working-directory: dashboard
        # Pure stdlib - no pip install required.
        run: python3 scripts/gen_demo_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        working-directory: dashboard
        run: npm ci

      - name: Build
        working-directory: dashboard
        env:
          BASE_PATH: /nasdaq/
        run: npm run build

      - name: Disable Jekyll processing
        run: touch dashboard/dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
